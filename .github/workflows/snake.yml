name: Generate Snake Animation

on:
  schedule: # Runs automatically every 24 hours
    - cron: "0 0 * * *"
  workflow_dispatch: # Allow manual runs
  push: # Run on every push to main
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate Snake files in dist/
        uses: Platane/snk@v3
        with:
          github_user_name: Ankitsingh2820
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake-light.svg?palette=github-light

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
